<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game 🐍</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(#0a0a2a, #050520);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    user-select: none;
    overflow: hidden;
}
#scoreBoard { color:white; font-size:24px; margin-bottom:10px; }
canvas { background: linear-gradient(#111144, #050520); border: 2px solid #fff; border-radius: 15px; }
.menu, .loading, .pauseMenu, .settingsMenu { 
    position:absolute; top:0; left:0; width:100%; height:100%; 
    display:flex; flex-direction:column; align-items:center; justify-content:center; 
    background: rgba(0,0,0,0.85); color:#fff; font-size:24px; z-index:10; 
}
.menu h1, .difficulty h2, .pauseMenu h2, .loading h2, .settingsMenu h2 { margin-bottom: 30px; text-align: center; text-shadow: 2px 2px 5px #000; }

/* Rock Button Style */
.menu button, .difficulty button, .pauseMenu button, .settingsMenu button { 
    margin:10px; padding:15px 40px; font-size:26px; font-weight:bold; border:none; border-radius:12px; 
    background: linear-gradient(145deg, #555 0%, #333 100%);
    color:#fff; box-shadow: 0 6px #222, inset 0 -3px #000;
    cursor:pointer; 
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease; 
}
.menu button:hover, .difficulty button:hover, .pauseMenu button:hover, .settingsMenu button:hover { 
    transform: scale(1.05);
    box-shadow: 0 4px #111, inset 0 -2px #111;
}
.menu button:active, .difficulty button:active, .pauseMenu button:active, .settingsMenu button:active { 
    transform: translateY(4px);
    box-shadow: 0 2px #111, inset 0 -1px #000;
    background: linear-gradient(145deg, #333 0%, #111 100%);
}

#pauseBtn { position:absolute; top:10px; left:10px; font-size:20px; padding:10px 15px; display:none; z-index:5; cursor:pointer; }

.buttons { margin-top:15px; display:grid; grid-template-columns:80px 80px 80px; grid-template-rows:80px 80px 80px; gap:10px; justify-items:center; align-items:center; display:none; }
.buttons button { 
    width:80px; height:80px; font-size:36px; font-weight:bold; 
    background: linear-gradient(145deg, #777 0%, #555 100%);
    border:none; border-radius:50%; box-shadow:0 6px #444, inset 0 -2px #222; touch-action: manipulation; transition:all 0.1s ease; 
}
.buttons button:active { transform:translateY(6px); box-shadow:0 2px #222, inset 0 -1px #000; background: linear-gradient(145deg, #555 0%, #333 100%); }
#up { grid-column:2; grid-row:1; } #left { grid-column:1; grid-row:2; } #down { grid-column:2; grid-row:2; } #right { grid-column:3; grid-row:2; }
input[type="range"] { width:200px; margin:20px 0; }
</style>
</head>
<body>

<div id="scoreBoard">Score: 0 | High Score: 0</div>
<canvas id="gameCanvas" width="400" height="400"></canvas>

<div class="menu" id="mainMenu">
    <h1>🐍 Snake Game</h1>
    <button id="playBtn">Play</button>
    <button id="difficultyBtn">Difficulty</button>
</div>

<div class="loading" id="loadingScreen" style="display:none;">
    <h2 id="loadingText">Loading</h2>
</div>

<div class="menu difficulty" id="difficultyMenu" style="display:none;">
    <h2>Select Difficulty</h2>
    <button data-speed="400">Easy</button>
    <button data-speed="250">Medium</button>
    <button data-speed="120">Hard</button>
    <button id="diffBack">Back</button>
</div>

<div class="pauseMenu" id="pauseMenu" style="display:none;">
    <h2>Paused</h2>
    <button id="resumeBtn">Resume</button>
    <button id="mainMenuBtn">Main Menu</button>
    <button id="settingsBtn">Settings</button>
</div>

<div class="settingsMenu" id="settingsMenu" style="display:none;">
    <h2>Settings</h2>
    <label>Game Volume</label>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5">
    <button id="muteBtn">Mute Music</button>
    <button id="resetHighScoreBtn">Reset High Score</button>
    <button id="settingsBack">Back</button>
</div>

<button id="pauseBtn">Pause</button>

<div class="buttons" id="touchButtons">
    <button id="up">⬆</button>
    <button id="left">⬅</button>
    <button id="down">⬇</button>
    <button id="right">➡</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreBoard = document.getElementById('scoreBoard');

const tileSize = 20;
const canvasSize = canvas.width;
const tiles = canvasSize / tileSize;

let snake = [], food, direction='RIGHT', nextDirection='RIGHT', score=0, gameOver=false, moveInterval=300, lastMoveTime=0, gamePaused=false, gameState='menu', floatingScores=[], gameVolume=0.5;
let highScore = parseInt(localStorage.getItem('highScore')) || 0;

// Sounds
const eatSound = new Audio('https://freesound.org/data/previews/274/274177_5121236-lq.mp3');
const gameOverSound = new Audio('https://freesound.org/data/previews/331/331912_3248244-lq.mp3');
const moveSound = new Audio('https://freesound.org/data/previews/414/414209_5121236-lq.mp3');
const bgMusic = new Audio('https://freesound.org/data/previews/493/493840_5121236-lq.mp3'); 
bgMusic.loop = true; 
[eatSound, gameOverSound, moveSound, bgMusic].forEach(s=>s.volume=gameVolume);

// Menu Elements
const mainMenu=document.getElementById('mainMenu'), loadingScreen=document.getElementById('loadingScreen'), loadingText=document.getElementById('loadingText'), difficultyMenu=document.getElementById('difficultyMenu'), pauseMenu=document.getElementById('pauseMenu'), settingsMenu=document.getElementById('settingsMenu'), playBtn=document.getElementById('playBtn'), difficultyBtn=document.getElementById('difficultyBtn'), diffBack=document.getElementById('diffBack'), pauseBtn=document.getElementById('pauseBtn'), resumeBtn=document.getElementById('resumeBtn'), mainMenuBtn=document.getElementById('mainMenuBtn'), settingsBtn=document.getElementById('settingsBtn'), settingsBack=document.getElementById('settingsBack'), volumeSlider=document.getElementById('volumeSlider'), muteBtn=document.getElementById('muteBtn'), touchButtons=document.getElementById('touchButtons'), resetHighScoreBtn=document.getElementById('resetHighScoreBtn');

let musicMuted=false;

// Difficulty
difficultyMenu.querySelectorAll('button[data-speed]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
        moveInterval=parseInt(btn.getAttribute('data-speed'));
        difficultyMenu.style.display='none';
        mainMenu.style.display='flex';
    });
});
diffBack.addEventListener('click', ()=>{ difficultyMenu.style.display='none'; mainMenu.style.display='flex'; });

// Volume & mute
volumeSlider.addEventListener('input', ()=>{
    gameVolume=parseFloat(volumeSlider.value);
    [eatSound, gameOverSound, moveSound].forEach(s=>s.volume=gameVolume);
    bgMusic.volume = gameVolume*0.5;
});
muteBtn.addEventListener('click', ()=>{
    musicMuted=!musicMuted;
    bgMusic.muted=musicMuted;
    muteBtn.textContent=musicMuted ? 'Unmute Music' : 'Mute Music';
});

// Reset High Score
resetHighScoreBtn.addEventListener('click', ()=>{
    highScore = 0;
    localStorage.setItem('highScore', highScore);
    updateScoreBoard();
});

// Main menu buttons
playBtn.addEventListener('click', ()=>{
    mainMenu.style.display='none';
    loadingScreen.style.display='flex';
    let dots=0;
    const loadingAnim=setInterval(()=>{ loadingText.textContent='Loading'+'.'.repeat(dots); dots=(dots+1)%4; },300);
    setTimeout(()=>{ clearInterval(loadingAnim); loadingScreen.style.display='none'; startGame(); },1200);
});
difficultyBtn.addEventListener('click', ()=>{ mainMenu.style.display='none'; difficultyMenu.style.display='flex'; });

// Pause
pauseBtn.addEventListener('click', ()=>{ if(gameState==='playing'){ gamePaused=true; pauseMenu.style.display='flex'; bgMusic.pause(); }});
resumeBtn.addEventListener('click', ()=>{ gamePaused=false; pauseMenu.style.display='none'; if(!musicMuted) bgMusic.play(); });
mainMenuBtn.addEventListener('click', ()=>{ pauseMenu.style.display='none'; gameState='menu'; mainMenu.style.display='flex'; touchButtons.style.display='none'; pauseBtn.style.display='none'; });
settingsBtn.addEventListener('click', ()=>{ pauseMenu.style.display='none'; settingsMenu.style.display='flex'; });
settingsBack.addEventListener('click', ()=>{ settingsMenu.style.display='none'; pauseMenu.style.display='flex'; });

// Touch & keyboard
['up','down','left','right'].forEach(id=>{
    document.getElementById(id).addEventListener('click', ()=>{
        if(id==='up' && direction!=='DOWN') nextDirection='UP';
        if(id==='down' && direction!=='UP') nextDirection='DOWN';
        if(id==='left' && direction!=='RIGHT') nextDirection='LEFT';
        if(id==='right' && direction!=='LEFT') nextDirection='RIGHT';
        moveSound.currentTime=0; moveSound.play();
        restartIfOver();
    });
});
document.addEventListener('keydown', e=>{
    const key=e.key.toLowerCase();
    if(key==='w' && direction!=='DOWN') { nextDirection='UP'; playMove(); }
    if(key==='s' && direction!=='UP') { nextDirection='DOWN'; playMove(); }
    if(key==='a' && direction!=='RIGHT') { nextDirection='LEFT'; playMove(); }
    if(key==='d' && direction!=='LEFT') { nextDirection='RIGHT'; playMove(); }
});
function playMove(){ moveSound.currentTime=0; moveSound.play(); }

// Food
function spawnFood(){
    let fx, fy;
    do { fx=Math.floor(Math.random()*tiles); fy=Math.floor(Math.random()*tiles); }
    while(snake.some(s=>s.x===fx && s.y===fy));
    return {x:fx, y:fy, pulse:0};
}

// Game start
function startGame(){
    snake=[{x:10,y:10}];
    direction='RIGHT'; nextDirection='RIGHT';
    score=0; gameOver=false; gamePaused=false;
    food=spawnFood(); floatingScores=[]; gameState='playing';
    pauseBtn.style.display='block'; touchButtons.style.display='grid';
    updateScoreBoard();
    if(!musicMuted) bgMusic.play();
    requestAnimationFrame(gameLoop);
}

// Restart after game over
function restartIfOver(){
    if(gameOver){
        snake=[{x:10,y:10}];
        direction='RIGHT'; nextDirection='RIGHT';
        score=0; food=spawnFood();
        gameOver=false; lastMoveTime=0;
        floatingScores=[];
        updateScoreBoard();
    }
}

function updateScoreBoard(){ 
    if(score>highScore){ highScore=score; localStorage.setItem('highScore', highScore); }
    scoreBoard.textContent="Score: "+score+" | High Score: "+highScore; 
}

function drawFloatingScores(){
    ctx.font="16px Arial"; ctx.fillStyle="#ffff00";
    for(let i=floatingScores.length-1;i>=0;i--){
        let f=floatingScores[i];
        ctx.globalAlpha=Math.max(f.alpha,0);
        ctx.fillText("+"+f.value,f.x,f.y);
        f.y-=0.8; f.alpha-=0.02;
        if(f.alpha<=0) floatingScores.splice(i,1);
    }
    ctx.globalAlpha=1;
}

function draw(){
    ctx.fillStyle="#111144"; ctx.fillRect(0,0,canvasSize,canvasSize);

    // Food
    food.pulse+=0.1;
    let pulseSize=tileSize*0.8+Math.sin(food.pulse)*4;
    ctx.fillStyle='red';
    ctx.beginPath();
    ctx.arc(food.x*tileSize+tileSize/2, food.y*tileSize+tileSize/2, pulseSize/2,0,Math.PI*2);
    ctx.fill();

    // Snake
    for(let i=0;i<snake.length;i++){
        let s=snake[i];
        ctx.fillStyle=i===0 ? "#00ff00":"#00aa00";
        ctx.beginPath();
        ctx.arc(s.x*tileSize+tileSize/2, s.y*tileSize+tileSize/2, tileSize/2-2,0,Math.PI*2);
        ctx.fill();
    }

    // Eyes
    let head=snake[0];
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(head.x*tileSize+tileSize*0.3, head.y*tileSize+tileSize*0.3,3,0,Math.PI*2);
    ctx.arc(head.x*tileSize+tileSize*0.7, head.y*tileSize+tileSize*0.3,3,0,Math.PI*2);
    ctx.fill();

    drawFloatingScores();
    updateScoreBoard();

    if(gameOver){
        ctx.fillStyle='red'; ctx.font='28px Arial';
        ctx.fillText("GAME OVER", 100, canvasSize/2);
        ctx.font='16px Arial';
        ctx.fillText("Use pause → Main Menu to restart", 20, canvasSize/2+30);
        gameOverSound.currentTime=0; gameOverSound.play();
    }
}

function update(time){
    if(gameOver || gamePaused) return;
    if(time-lastMoveTime<moveInterval) return;
    lastMoveTime=time;

    direction=nextDirection;
    let head={...snake[0]};
    if(direction==='UP') head.y--;
    if(direction==='DOWN') head.y++;
    if(direction==='LEFT') head.x--;
    if(direction==='RIGHT') head.x++;

    // collision
    if(head.x<0||head.y<0||head.x>=tiles||head.y>=tiles||snake.some(s=>s.x===head.x&&s.y===head.y)){ gameOver=true; return; }

    snake.unshift(head);

    if(head.x===food.x && head.y===food.y){
        score+=10;
        floatingScores.push({x:head.x*tileSize+tileSize/2,y:head.y*tileSize+tileSize/2,value:10,alpha:1});
        food=spawnFood();
        moveInterval=Math.max(60,moveInterval-5);
        eatSound.currentTime=0; eatSound.play();
    } else snake.pop();
}

function gameLoop(time){
    if(gameState==='playing'){ update(time); draw(); }
    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
</body>
</html>
